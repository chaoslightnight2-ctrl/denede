# Denede: tek bir dar niş yerine geniş Türkçe merak ve bilgi kanalı.
# Groq her çalıştırmada taze konu seçer; state.json son konuların tekrarını önler.
niche: "Türkçe merak ve bilgi kanalı. Psikoloji, bilim, uzay, doğa, teknoloji, tarih, arkeoloji, coğrafya, kültür, dil, icatlar ve gündelik yaşam konuları arasında dönüşümlü içerik üret."
audience: "Türkçe konuşan, meraklı ve kısa videolarda hızlı, şaşırtıcı ama güvenilir bilgi arayan geniş izleyici kitlesi"
language: tr

script:
  model: openai/gpt-oss-120b
  target_seconds: 32
  words_per_second: 2.2

voice:
  provider: edge
  voice: tr-TR-EmelNeural
  rate: "+10%"
  pitch: "+0Hz"

captions:
  whisper_model: base
  font: "DejaVu Sans"
  font_size: 90
  primary_color: "&H00FFFFFF"
  outline_color: "&H00000000"
  outline: 6
  words_per_caption: 1
  position_y: 0.55

video:
  width: 1080
  height: 1920
  fps: 30

upload:
  privacy: "public"
  category_id: "22"
  made_for_kids: false
  default_tags: ["denede", "turkce bilgi", "shorts"]

comments:
  model: openai/gpt-oss-20b
  poll_interval_minutes: 180
  auto_reply: true
  delete_spam: true
