name: Refresh Denede caption fix safely
on:
  push:
    branches: [main]
    paths: [".github/control/caption-refresh.json"]
permissions:
  actions: write
  contents: read
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Stop only a batch without accepted uploads
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          source_run=36708904477
          read_count() {
            gh api repos/${{ github.repository }}/contents/freefaceless/state.json --jq .content | base64 -d | python -c 'import json,sys; s=json.load(sys.stdin); print(sum(str(r.get("run_id"))=="36708904477" and bool(r.get("video_id")) for r in s.get("published",[])))'
          }
          before=$(read_count)
          if [ "$before" != "0" ]; then echo "Existing accepted uploads found; keeping batch and avoiding duplicate inserts"; exit 0; fi
          gh run cancel "$source_run" || true
          gh run watch "$source_run" || true
          after=$(read_count)
          if [ "$after" != "0" ]; then echo "An upload was accepted before cancellation; do not reupload"; exit 1; fi
          gh workflow run freefaceless.yml --ref main -f dry_run=false
