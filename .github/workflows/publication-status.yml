name: Inspect actual YouTube publication
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install read-only YouTube dependencies
        run: pip install google-api-python-client google-auth requests
      - name: Read actual owner upload and publication status
        env:
          CLIENT_SECRETS_JSON: ${{ secrets.CLIENT_SECRETS_JSON }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          YOUTUBE_ANALYTICS_REFRESH_TOKEN: ${{ secrets.YOUTUBE_ANALYTICS_REFRESH_TOKEN }}
          YOUTUBE_ANALYTICS_CLIENT_SECRETS_JSON: ${{ secrets.YOUTUBE_ANALYTICS_CLIENT_SECRETS_JSON }}
        run: python maintenance/inspect_channel_publication.py
      - name: Preserve read-only publication evidence
        if: always()
        env:
          PUBLISH_UPLOAD_CHECKPOINTS: "1"
        run: PYTHONPATH=freefaceless python -m src.upload_checkpoint maintenance/channel-publication.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: channel-publication-audit
          path: maintenance/channel-publication.json
