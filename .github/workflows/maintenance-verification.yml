name: Restart verification with repaired montage
on:
  push:
    branches: [main]
    paths: [".github/maintenance/control-20260930.json"]
permissions:
  actions: write
  contents: read
jobs:
  restart:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Stop superseded montage run and start fixed code
        run: |
          gh run cancel 36678935432 || true
          gh run watch 36678935432 || true
          gh workflow run freefaceless.yml --ref main -f dry_run=false
