name: Render one new video for quality inspection
'on':
  push:
    branches:
    - main
    paths:
    - .github/maintenance/audit-*.json
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: one-video-quality-audit
  cancel-in-progress: true
jobs:
  audit:
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    defaults:
      run:
        working-directory: freefaceless
    steps:
    - name: Repoyu klonla
      uses: actions/checkout@v4
    - name: Python kur
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: pip
        cache-dependency-path: freefaceless/requirements.txt
    - name: Bağımlılıklar
      run: 'sudo apt-get update -qq

        sudo apt-get install -y --no-install-recommends ffmpeg fonts-dejavu-core

        pip install --upgrade pip

        pip install -r requirements.txt

        '
    - name: Quality regression checks
      run: python -m unittest test_quality_regressions.py
    - name: Render one real Groq sample without YouTube upload
      env:
        TZ: Europe/Istanbul
        GROQ_MODEL: openai/gpt-oss-120b
        GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        YOUTUBE_REFRESH_TOKEN: audit_upload_disabled
        DRY_RUN: '1'
        ENABLE_YOUTUBE_UPLOAD: '0'
        PUBLISH_UPLOAD_CHECKPOINTS: '0'
        VOICE: tr-TR-AhmetNeural
        VOICE_RATE: +0%
        VOICE_PITCH: -2Hz
        IMAGEMAGICK_BINARY: /usr/bin/convert
        SUBTITLE_FONT: DejaVu-Sans-Bold
      run: 'python -m pip install Pillow

        python ../maintenance/render_one_audit.py denede'
    - name: Upload video and inspection evidence
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: one-video-quality-audit
        path: 'freefaceless/quality-audit/

          freefaceless/bot.log'
        retention-days: 7
        if-no-files-found: warn
