name: FreeFaceless TR (günlük 4 video)

# Her gün 00:30 TR (= 21:30 UTC): 4 farklı niş, 06/12/18/23 slotlarına zamanlı yayın.
# YouTube kotası (10.000 ünite/gün, yükleme başına ~1600) 4 videoya yeter;
# eski botun zamanlayıcısı bu yüzden manuele alındı (shorts_generator.yml).
on:
  schedule:
    - cron: '30 21 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Kuru test (YouTube yüklemesi YOK, kota harcamaz)'
        required: false
        default: true
        type: boolean

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    defaults:
      run:
        working-directory: freefaceless

    steps:
      - name: Repoyu klonla
        uses: actions/checkout@v4

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: freefaceless/requirements.txt

      - name: Bağımlılıklar
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg fonts-dejavu-core
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: 4 Türkçe Shorts üret ve zamanlı yayınla
        id: run_bot
        continue-on-error: true
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          CLIENT_SECRETS_JSON: ${{ secrets.CLIENT_SECRETS_JSON }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: |
          echo "GROQ_API_KEY=${GROQ_API_KEY}" > .env
          echo "PEXELS_API_KEY=${PEXELS_API_KEY}" >> .env
          EXTRA=""
          if [ "${{ inputs.dry_run }}" = "true" ]; then EXTRA="--no-upload"; fi
          python -m src.daily_batch $EXTRA

      - name: Konu tekrarını önlemek için state'i commit'le
        if: ${{ always() && inputs.dry_run != true }}
        continue-on-error: true
        uses: EndBug/add-and-commit@v9
        with:
          add: 'freefaceless/state.json freefaceless/daily_manifest.json'
          message: 'ci: freefaceless state [skip ci]'
          default_author: github_actions
          pull: '--rebase --autostash'

      - name: Çıktıları sakla
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: freefaceless-output
          path: |
            freefaceless/output/**/final.mp4
            freefaceless/daily_manifest.json
            freefaceless/logs/*.log
          if-no-files-found: ignore

      - name: Bot hata verdiyse workflow'u düşür
        if: steps.run_bot.outcome != 'success'
        run: exit 1
